name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # The spec repo can trigger a rebuild by sending a repository_dispatch event.
  repository_dispatch:
    types: [spec-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Checkout the spec (single source of truth)
        uses: actions/checkout@v6
        with:
          repository: product-definition-as-code/spec
          path: .spec-src
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/sync-spec.mjs .spec-src
      - run: npx astro build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
